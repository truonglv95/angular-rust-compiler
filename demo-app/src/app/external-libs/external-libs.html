<div style="padding: 20px">
  <h2>External Libraries Demo</h2>

  <div style="margin-bottom: 20px">
    <button
      (click)="showToast()"
      style="
        padding: 10px 20px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      "
    >
      Show Toast
    </button>
  </div>

  <div style="height: 400px; background: #f5f5f5; border-radius: 8px; overflow: hidden">
    <ngx-charts-bar-vertical
      [view]="view"
      [scheme]="colorScheme"
      [results]="single"
      [gradient]="gradient"
      [xAxis]="showXAxis"
      [yAxis]="showYAxis"
      [legend]="showLegend"
      [showXAxisLabel]="showXAxisLabel"
      [showYAxisLabel]="showYAxisLabel"
      [xAxisLabel]="xAxisLabel"
      [yAxisLabel]="yAxisLabel"
    >
    </ngx-charts-bar-vertical>
  </div>
  <div style="margin-top: 30px">
    <h3>AgGrid Demo</h3>
    <ag-grid-angular
      style="width: 100%; height: 300px"
      class="ag-theme-quartz"
      [rowData]="rowData"
      [columnDefs]="colDefs"
    >
    </ag-grid-angular>
  </div>

  <div style="margin-top: 30px">
    <h3>PrimeNG Demo</h3>
    <p-button label="Click Me" icon="pi pi-check" [loading]="loading" (click)="load()"></p-button>
  </div>

  <div style="margin-top: 30px">
    <h3>ngx-translate Demo</h3>
    <p>{{ 'HELLO' | translate }}</p>
  </div>

  <div style="margin-top: 30px">
    <h3>ngx-skeleton-loader Demo</h3>
    <ngx-skeleton-loader count="2" appearance="circle"></ngx-skeleton-loader>
    <ngx-skeleton-loader count="1" appearance="line"></ngx-skeleton-loader>
  </div>
</div>
