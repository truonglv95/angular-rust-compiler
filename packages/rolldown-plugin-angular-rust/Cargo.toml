[package]
name = "rolldown-plugin-angular-rust"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# We depend on rolldown_plugin for the Plugin trait
rolldown_plugin = { git = "https://github.com/rolldown/rolldown", tag = "v1.0.0-rc.5" }
rolldown_common = { git = "https://github.com/rolldown/rolldown", tag = "v1.0.0-rc.5" }
async-trait = "0.1"

# The Angular Rust Compiler to do the actual transform
angular-compiler-cli = { path = "../compiler-cli" }
angular-compiler = { path = "../compiler" }

# For async/sync bridging if needed
tokio = { version = "1.0", features = ["full"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
